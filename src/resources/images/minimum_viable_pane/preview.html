<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minimum Viable Pane XP Logo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111820;
      --ink: #f2f5f7;
      --muted: #aeb8c2;
      --line: #263444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 18px;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(100%, 980px);
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--line);
      background: var(--bg);
    }

    p {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <img src="minimum_viable_pane_logo.svg" alt="Minimum Viable Pane XP logo">
    <p>SVG preview.</p>
  </main>
</body>
</html>
